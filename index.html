<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Free online image compressor and resizer. Compress, resize and download images directly in your browser.">
<title>Image Compressor & Resizer</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #172033;
}

header {
  background: #ffffff;
  padding: 22px 16px;
  text-align: center;
  border-bottom: 1px solid #e5e7eb;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 8px 0 0;
  color: #667085;
}

.container {
  width: min(900px, 92%);
  margin: 30px auto;
}

.card {
  background: #ffffff;
  border-radius: 16px;
  padding: 22px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.06);
  margin-bottom: 20px;
}

.upload-box {
  border: 2px dashed #b8c0cc;
  border-radius: 14px;
  padding: 40px 20px;
  text-align: center;
  cursor: pointer;
}

.upload-box:hover {
  border-color: #2563eb;
}

.upload-box h2 {
  margin-top: 0;
}

input[type="file"] {
  display: none;
}

button {
  border: none;
  border-radius: 10px;
  padding: 13px 18px;
  font-size: 15px;
  cursor: pointer;
  background: #2563eb;
  color: white;
  font-weight: bold;
}

button:hover {
  opacity: 0.9;
}

button.secondary {
  background: #667085;
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-top: 20px;
}

.control {
  background: #f8fafc;
  padding: 15px;
  border-radius: 10px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

input[type="number"],
select {
  width: 100%;
  padding: 11px;
  border: 1px solid #d0d5dd;
  border-radius: 8px;
  font-size: 15px;
}

.preview {
  text-align: center;
  margin-top: 20px;
}

.preview img {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
}

.result {
  display: none;
}

.info {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 15px 0;
}

.info div {
  background: #f8fafc;
  padding: 12px;
  border-radius: 8px;
}

.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

footer {
  text-align: center;
  padding: 30px 15px;
  color: #667085;
  font-size: 14px;
}

@media (max-width: 600px) {
  .controls,
  .info {
    grid-template-columns: 1fr;
  }

  header h1 {
    font-size: 24px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Image Compressor & Resizer</h1>
  <p>Compress and resize your images quickly and for free.</p>
</header>

<main class="container">

  <div class="card">
    <div class="upload-box" id="uploadBox">
      <h2>Upload an Image</h2>
      <p>JPG, PNG, WebP and other browser-supported images</p>
      <button type="button" onclick="document.getElementById('fileInput').click()">
        Choose Image
      </button>
      <input type="file" id="fileInput" accept="image/*">
    </div>
  </div>

  <div class="card" id="editor" style="display:none;">

    <div class="preview">
      <img id="previewImage" alt="Image preview">
    </div>

    <div class="controls">

      <div class="control">
        <label for="width">Width (px)</label>
        <input type="number" id="width" min="1">
      </div>

      <div class="control">
        <label for="height">Height (px)</label>
        <input type="number" id="height" min="1">
      </div>

      <div class="control">
        <label for="quality">Quality</label>
        <select id="quality">
          <option value="0.9">High — 90%</option>
          <option value="0.75" selected>Good — 75%</option>
          <option value="0.6">Medium — 60%</option>
          <option value="0.4">Small File — 40%</option>
        </select>
      </div>

      <div class="control">
        <label for="format">Output Format</label>
        <select id="format">
          <option value="image/jpeg">JPG</option>
          <option value="image/png">PNG</option>
          <option value="image/webp">WebP</option>
        </select>
      </div>

    </div>

    <br>

    <button onclick="processImage()">Compress & Resize</button>
    <button class="secondary" onclick="resetTool()">Choose Another</button>

  </div>

  <div class="card result" id="result">

    <h2>Your Result</h2>

    <div class="preview">
      <img id="resultImage" alt="Compressed image">
    </div>

    <div class="info">
      <div>
        <strong>Original Size</strong>
        <div id="originalSize">-</div>
      </div>

      <div>
        <strong>New Size</strong>
        <div id="newSize">-</div>
      </div>
    </div>

    <div class="actions">
      <button id="downloadButton">Download Image</button>
      <button class="secondary" onclick="resetTool()">Compress Another</button>
    </div>

  </div>

</main>

<footer>
  <p>Free Image Compressor & Resizer</p>
  <p>Your images are processed directly in your browser.</p>
</footer>

<script>
let selectedFile = null;
let originalImage = null;

const fileInput = document.getElementById("fileInput");
const editor = document.getElementById("editor");
const result = document.getElementById("result");
const previewImage = document.getElementById("previewImage");
const resultImage = document.getElementById("resultImage");
const widthInput = document.getElementById("width");
const heightInput = document.getElementById("height");
const qualityInput = document.getElementById("quality");
const formatInput = document.getElementById("format");
const originalSize = document.getElementById("originalSize");
const newSize = document.getElementById("newSize");
const downloadButton = document.getElementById("downloadButton");

fileInput.addEventListener("change", function () {
  const file = this.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("Please choose an image file.");
    return;
  }

  selectedFile = file;

  const reader = new FileReader();

  reader.onload = function (event) {
    previewImage.src = event.target.result;

    originalImage = new Image();

    originalImage.onload = function () {
      widthInput.value = originalImage.width;
      heightInput.value = originalImage.height;
      editor.style.display = "block";
      result.style.display = "none";
    };

    originalImage.src = event.target.result;
  };

  reader.readAsDataURL(file);
});

function processImage() {

  if (!selectedFile || !originalImage) {
    alert("Please choose an image first.");
    return;
  }

  const width = parseInt(widthInput.value);
  const height = parseInt(heightInput.value);
  const quality = parseFloat(qualityInput.value);
  const format = formatInput.value;

  if (!width || !height || width < 1 || height < 1) {
    alert("Please enter a valid width and height.");
    return;
  }

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = width;
  canvas.height = height;

  ctx.drawImage(originalImage, 0, 0, width, height);

  canvas.toBlob(function (blob) {

    if (!blob) {
      alert("Could not process this image.");
      return;
    }

    const url = URL.createObjectURL(blob);

    resultImage.src = url;

    originalSize.textContent = formatBytes(selectedFile.size);
    newSize.textContent = formatBytes(blob.size);

    downloadButton.onclick = function () {

      const extension =
        format === "image/png"
          ? "png"
          : format === "image/webp"
          ? "webp"
          : "jpg";

      const link = document.createElement("a");

      link.href = url;
      link.download = "compressed-image." + extension;

      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    result.style.display = "block";

    result.scrollIntoView({
      behavior: "smooth"
    });

  }, format, quality);
}

function formatBytes(bytes) {

  if (bytes === 0) return "0 Bytes";

  const units = [
    "Bytes",
    "KB",
    "MB",
    "GB"
  ];

  const index = Math.floor(
    Math.log(bytes) / Math.log(1024)
  );

  return (
    parseFloat(
      (bytes / Math.pow(1024, index)).toFixed(2)
    )
    + " "
    + units[index]
  );
}

function resetTool() {

  selectedFile = null;
  originalImage = null;

  fileInput.value = "";

  editor.style.display = "none";
  result.style.display = "none";

  previewImage.src = "";
  resultImage.src = "";
}
</script>

</body>
</html>
