<script>
const fileInput = document.getElementById("fileInput");
const chooseBtn = document.getElementById("chooseBtn");
const dropZone = document.getElementById("dropZone");
const fileList = document.getElementById("fileList");
const toolCard = document.getElementById("toolCard");

const processMode = document.getElementById("processMode");
const resizeMode = document.getElementById("resizeMode");
const convertMode = document.getElementById("convertMode");

const compressionPanel = document.getElementById("compressionPanel");
const resizerPanel = document.getElementById("resizerPanel");
const converterPanel = document.getElementById("converterPanel");
const dimensionPanel = document.getElementById("dimensionPanel");
const editingControls = document.getElementById("editingControls");

const compressionMode = document.getElementById("compressionMode");
const quality = document.getElementById("quality");
const qualityControl = document.getElementById("qualityControl");
const targetPanel = document.getElementById("targetPanel");
const targetSize = document.getElementById("targetSize");
const targetUnit = document.getElementById("targetUnit");

const resizePreset = document.getElementById("resizePreset");
const resizeQuality = document.getElementById("resizeQuality");

const widthInput = document.getElementById("width");
const heightInput = document.getElementById("height");
const aspect = document.getElementById("aspect");

const cropMode = document.getElementById("cropMode");
const cropRatioControl = document.getElementById("cropRatioControl");
const cropRatio = document.getElementById("cropRatio");
const cropInfo = document.getElementById("cropInfo");

const formatSelect = document.getElementById("format");

const processBtn = document.getElementById("processBtn");
const startOverBtn = document.getElementById("startOverBtn");

const progressWrap = document.getElementById("progressWrap");
const progress = document.getElementById("progress");
const progressText = document.getElementById("progressText");

const resultsSection = document.getElementById("resultsSection");
const results = document.getElementById("results");

let files = [];
let toolMode = "process";
let originalWidth = 0;
let originalHeight = 0;

chooseBtn.addEventListener("click", () => {
  fileInput.click();
});

fileInput.addEventListener("change", () => {
  addFiles(Array.from(fileInput.files));
});

dropZone.addEventListener("dragover", (e) => {
  e.preventDefault();
  dropZone.classList.add("dragover");
});

dropZone.addEventListener("dragleave", () => {
  dropZone.classList.remove("dragover");
});

dropZone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  addFiles(Array.from(e.dataTransfer.files));
});

function addFiles(newFiles) {

  const valid = newFiles.filter(file =>
    ["image/jpeg", "image/png", "image/webp"].includes(file.type)
  );

  files = [...files, ...valid];

  renderFileList();

  if (files.length) {
    toolCard.classList.remove("hidden");
    loadFirstImageInfo();
  }
}

function renderFileList() {

  fileList.innerHTML = "";

  files.forEach((file, index) => {

    const row = document.createElement("div");
    row.className = "file-item";

    row.innerHTML = `
      <span class="file-name">
        ${escapeHtml(file.name)}<br>
        <small>${formatBytes(file.size)}</small>
      </span>

      <button
        type="button"
        class="remove-btn"
        onclick="removeFile(${index})">
        Remove
      </button>
    `;

    fileList.appendChild(row);
  });
}

window.removeFile = function(index) {

  files.splice(index, 1);

  renderFileList();

  if (!files.length) {
    resetAll();
  } else {
    loadFirstImageInfo();
  }
};

function escapeHtml(text) {

  return text.replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function loadImage(file) {

  return new Promise((resolve, reject) => {

    const url = URL.createObjectURL(file);
    const img = new Image();

    img.onload = () => {
      URL.revokeObjectURL(url);
      resolve(img);
    };

    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("Could not load image."));
    };

    img.src = url;
  });
}

async function loadFirstImageInfo() {

  if (!files.length) return;

  try {

    const img = await loadImage(files[0]);

    originalWidth = img.width;
    originalHeight = img.height;

    widthInput.value = img.width;
    heightInput.value = img.height;

  } catch (error) {
    console.error(error);
  }
}

function setMode(mode) {

  toolMode = mode;

  processMode.classList.toggle("active", mode === "process");
  resizeMode.classList.toggle("active", mode === "resize");
  convertMode.classList.toggle("active", mode === "convert");

  compressionPanel.classList.toggle("hidden", mode !== "process");
  resizerPanel.classList.toggle("hidden", mode !== "resize");
  converterPanel.classList.toggle("hidden", mode !== "convert");

  dimensionPanel.classList.toggle("hidden", mode === "convert");

  editingControls.classList.toggle("hidden", mode === "convert");

  if (mode === "process") {
    processBtn.textContent = "Compress & Process Images";
  }

  if (mode === "resize") {
    processBtn.textContent = "Resize Images";
  }

  if (mode === "convert") {
    processBtn.textContent = "Convert Images";
  }

  updateCropUI();
}

processMode.addEventListener("click", () => {
  setMode("process");
});

resizeMode.addEventListener("click", () => {
  setMode("resize");
});

convertMode.addEventListener("click", () => {
  setMode("convert");
});

compressionMode.addEventListener("change", () => {

  const target = compressionMode.value === "target";

  qualityControl.classList.toggle("hidden", target);
  targetPanel.classList.toggle("hidden", !target);
});

resizePreset.addEventListener("change", () => {

  if (resizePreset.value === "custom") return;

  if (!originalWidth || !originalHeight) return;

  const targetWidth = Number(resizePreset.value);

  const newWidth = Math.min(targetWidth, originalWidth);

  const newHeight = Math.round(
    newWidth * originalHeight / originalWidth
  );

  widthInput.value = newWidth;
  heightInput.value = newHeight;
});

widthInput.addEventListener("input", () => {

  resizePreset.value = "custom";

  if (!aspect.checked || !originalWidth || !originalHeight) {
    return;
  }

  const width = Number(widthInput.value);

  if (width > 0) {

    heightInput.value = Math.round(
      width * originalHeight / originalWidth
    );
  }
});

heightInput.addEventListener("input", () => {

  resizePreset.value = "custom";

  if (!aspect.checked || !originalWidth || !originalHeight) {
    return;
  }

  const height = Number(heightInput.value);

  if (height > 0) {

    widthInput.value = Math.round(
      height * originalWidth / originalHeight
    );
  }
});

aspect.addEventListener("change", () => {

  if (!aspect.checked) return;

  if (!originalWidth || !originalHeight) return;

  const width = Number(widthInput.value);

  if (width > 0) {

    heightInput.value = Math.round(
      width * originalHeight / originalWidth
    );
  }
});

cropMode.addEventListener("change", updateCropUI);
cropRatio.addEventListener("change", updateCropUI);

function updateCropUI() {

  const enabled =
    cropMode.value === "crop" &&
    toolMode !== "convert";

  cropRatioControl.classList.toggle("hidden", !enabled);
  cropInfo.classList.toggle("hidden", !enabled);

  if (enabled) {

    cropInfo.innerHTML =
      "✂️ Crop is now active. ImageTools will crop from the center using your selected ratio before resizing or compressing.";
  }
}

function getCropDimensions(imgWidth, imgHeight) {

  if (cropMode.value !== "crop") {

    return {
      sx: 0,
      sy: 0,
      sw: imgWidth,
      sh: imgHeight
    };
  }

  const selected = cropRatio.value;

  if (selected === "free") {

    return {
      sx: 0,
      sy: 0,
      sw: imgWidth,
      sh: imgHeight
    };
  }

  let targetRatio;

  if (selected === "1") {
    targetRatio = 1;
  } else if (selected === "4/3") {
    targetRatio = 4 / 3;
  } else if (selected === "16/9") {
    targetRatio = 16 / 9;
  } else {
    return {
      sx: 0,
      sy: 0,
      sw: imgWidth,
      sh: imgHeight
    };
  }

  const originalRatio = imgWidth / imgHeight;

  let sw;
  let sh;

  if (originalRatio > targetRatio) {

    /*
      Image is wider than requested ratio.
      Reduce width while keeping height.
    */

    sh = imgHeight;
    sw = Math.round(sh * targetRatio);

  } else {

    /*
      Image is taller than requested ratio.
      Reduce height while keeping width.
    */

    sw = imgWidth;
    sh = Math.round(sw / targetRatio);
  }

  const sx = Math.round((imgWidth - sw) / 2);
  const sy = Math.round((imgHeight - sh) / 2);

  return {
    sx,
    sy,
    sw,
    sh
  };
}

function formatBytes(bytes) {

  if (bytes < 1024) {
    return bytes + " B";
  }

  if (bytes < 1024 * 1024) {
    return (bytes / 1024).toFixed(2) + " KB";
  }

  return (bytes / (1024 * 1024)).toFixed(2) + " MB";
}

function extensionFor(type) {

  if (type === "image/png") return "png";
  if (type === "image/webp") return "webp";

  return "jpg";
}

function baseName(name) {

  return name.replace(/\.[^/.]+$/, "");
}

function savedPercent(original, newSize) {

  if (original <= 0) return 0;

  return Math.max(
    0,
    Math.round((1 - newSize / original) * 100)
  );
}

function createCanvas(
  img,
  width,
  height,
  type,
  crop
) {

  const canvas = document.createElement("canvas");

  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d");

  if (type === "image/jpeg") {

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, width, height);
  }

  if (crop) {

    ctx.drawImage(
      img,
      crop.sx,
      crop.sy,
      crop.sw,
      crop.sh,
      0,
      0,
      width,
      height
    );

  } else {

    ctx.drawImage(
      img,
      0,
      0,
      width,
      height
    );
  }

  return canvas;
}

function canvasToBlob(canvas, type, qualityValue) {

  return new Promise(resolve => {

    canvas.toBlob(
      blob => resolve(blob),
      type,
      qualityValue
    );
  });
}

async function createImage(
  file,
  width,
  height,
  type,
  qualityValue
) {

  const img = await loadImage(file);

  const crop = getCropDimensions(
    img.width,
    img.height
  );

  const canvas = createCanvas(
    img,
    width,
    height,
    type,
    crop
  );

  return await canvasToBlob(
    canvas,
    type,
    qualityValue
  );
}

async function compressToTarget(
  file,
  width,
  height,
  type,
  targetBytes
) {

  if (file.size <= targetBytes) {

    return {
      blob: await createImage(
        file,
        width,
        height,
        type,
        type === "image/png"
          ? undefined
          : .92
      ),
      reached: true
    };
  }

  if (type === "image/png") {

    const blob = await createImage(
      file,
      width,
      height,
      type,
      undefined
    );

    return {
      blob,
      reached: blob.size <= targetBytes
    };
  }

  let low = .05;
  let high = 1;
  let bestBlob = null;

  for (let i = 0; i < 10; i++) {

    const mid = (low + high) / 2;

    const blob = await createImage(
      file,
      width,
      height,
      type,
      mid
    );

    if (blob.size <= targetBytes) {

      bestBlob = blob;
      low = mid;

    } else {

      high = mid;
    }
  }

  if (bestBlob) {

    return {
      blob: bestBlob,
      reached: true
    };
  }

  const fallback = await createImage(
    file,
    width,
    height,
    type,
    .05
  );

  return {
    blob: fallback,
    reached: fallback.size <= targetBytes
  };
}

async function processFiles() {

  if (!files.length) return;

  results.innerHTML = "";
  resultsSection.classList.remove("hidden");
  progressWrap.classList.remove("hidden");
  processBtn.disabled = true;

  for (let i = 0; i < files.length; i++) {

    const file = files[i];

    try {

      progressText.textContent =
        `Processing ${i + 1} of ${files.length}: ${file.name}`;

      progress.style.width =
        Math.round((i / files.length) * 100) + "%";

      if (toolMode === "convert") {

        await convertFile(file);

      } else if (toolMode === "resize") {

        await resizeFile(file);

      } else {

        await compressFile(file);
      }

    } catch (error) {

      console.error(error);

      addErrorResult(
        file,
        error.message ||
        "Could not process this image."
      );
    }

    progress.style.width =
      Math.round(((i + 1) / files.length) * 100) + "%";
  }

  progressText.textContent =
    "Processing complete.";

  processBtn.disabled = false;

  startOverBtn.classList.remove("hidden");
}

async function convertFile(file) {

  const type = formatSelect.value;

  const img = await loadImage(file);

  /*
    Converter intentionally does not crop.
    Conversion keeps the original dimensions.
  */

  const canvas = document.createElement("canvas");

  canvas.width = img.width;
  canvas.height = img.height;

  const ctx = canvas.getContext("2d");

  if (type === "image/jpeg") {

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(
      0,
      0,
      img.width,
      img.height
    );
  }

  ctx.drawImage(
    img,
    0,
    0,
    img.width,
    img.height
  );

  const blob = await canvasToBlob(
    canvas,
    type,
    type === "image/png"
      ? undefined
      : .92
  );

  addResult(
    file,
    blob,
    type,
    img.width,
    img.height,
    `Converted to ${extensionFor(type).toUpperCase()}`
  );
}

async function resizeFile(file) {

  const img = await loadImage(file);

  const crop = getCropDimensions(
    img.width,
    img.height
  );

  const cropRatioWidth =
    crop.sw / img.width;

  const cropRatioHeight =
    crop.sh / img.height;

  let width =
    Number(widthInput.value) ||
    crop.sw;

  let height =
    Number(heightInput.value) ||
    crop.sh;

  if (resizePreset.value !== "custom") {

    const presetWidth =
      Number(resizePreset.value);

    width = Math.min(
      presetWidth,
      crop.sw
    );

    height = Math.round(
      width * crop.sh / crop.sw
    );

  } else if (aspect.checked) {

    width = Math.max(
      1,
      width
    );

    height = Math.round(
      width * crop.sh / crop.sw
    );
  }

  width = Math.max(
    1,
    Math.round(width)
  );

  height = Math.max(
    1,
    Math.round(height)
  );

  const type = formatSelect.value;

  const q =
    type === "image/png"
      ? undefined
      : Number(resizeQuality.value);

  const blob = await createImage(
    file,
    width,
    height,
    type,
    q
  );

  let statusText =
    `📐 Resized to ${width} × ${height}px`;

  if (cropMode.value === "crop") {

    statusText =
      `✂️ Cropped & resized to ${width} × ${height}px`;
  }

  addResult(
    file,
    blob,
    type,
    width,
    height,
    statusText
  );
}

async function compressFile(file) {

  const img = await loadImage(file);

  const crop = getCropDimensions(
    img.width,
    img.height
  );

  let width =
    Number(widthInput.value) ||
    crop.sw;

  let height =
    Number(heightInput.value) ||
    crop.sh;

  if (cropMode.value === "crop") {

    /*
      After cropping, use the cropped image ratio.
    */

    if (aspect.checked) {

      height = Math.round(
        width * crop.sh / crop.sw
      );
    }

  } else if (aspect.checked) {

    const ratio =
      img.width / img.height;

    height = Math.round(
      width / ratio
    );
  }

  width = Math.max(
    1,
    Math.round(width)
  );

  height = Math.max(
    1,
    Math.round(height)
  );

  const type = formatSelect.value;

  let blob;
  let statusText =
    "Compressed successfully";

  if (compressionMode.value === "target") {

    let targetBytes =
      Number(targetSize.value) || 200;

    if (targetUnit.value === "KB") {

      targetBytes *= 1024;

    } else {

      targetBytes *=
        1024 * 1024;
    }

    const result =
      await compressToTarget(
        file,
        width,
        height,
        type,
        targetBytes
      );

    blob = result.blob;

    if (result.reached) {

      statusText =
        `🎯 Target reached — ${formatBytes(blob.size)}`;

    } else {

      statusText =
        `⚠️ Closest result — ${formatBytes(blob.size)}`;
    }

  } else {

    const q =
      type === "image/png"
        ? undefined
        : Number(quality.value);

    blob = await createImage(
      file,
      width,
      height,
      type,
      q
    );
  }

  if (cropMode.value === "crop") {

    statusText =
      `✂️ Cropped & ${statusText}`;
  }

  addResult(
    file,
    blob,
    type,
    width,
    height,
    statusText
  );
}

function addResult(
  file,
  blob,
  type,
  width,
  height,
  statusText
) {

  const saved =
    savedPercent(
      file.size,
      blob.size
    );

  const card =
    document.createElement("div");

  card.className = "result";

  const url =
    URL.createObjectURL(blob);

  const extension =
    extensionFor(type);

  let suffix = "";

  if (toolMode === "resize") {

    suffix = "-resized";

  } else if (toolMode === "convert") {

    suffix = "-converted";

  } else {

    suffix = "-compressed";
  }

  if (cropMode.value === "crop") {

    suffix += "-cropped";
  }

  const downloadName =
    `${baseName(file.name)}${suffix}.${extension}`;

  card.innerHTML = `
    <h4>${escapeHtml(file.name)}</h4>

    <div class="result-grid">

      <div class="stat">
        Original
        <strong>${formatBytes(file.size)}</strong>
      </div>

      <div class="stat">
        New Size
        <strong>${formatBytes(blob.size)}</strong>
      </div>

      <div class="stat">
        Saved
        <strong>${saved}%</strong>
      </div>

    </div>

    <div class="stat">
      ${statusText}<br>
      <strong>${width} × ${height}px</strong>
    </div>

    <br>

    <a
      href="${url}"
      download="${downloadName}"
      style="text-decoration:none;"
    >
      <button
        type="button"
        class="download">
        Download
      </button>
    </a>
  `;

  results.appendChild(card);
}

function addErrorResult(
  file,
  message
) {

  const card =
    document.createElement("div");

  card.className = "result";

  card.innerHTML = `
    <h4>${escapeHtml(file.name)}</h4>

    <div class="info warning">
      ⚠️ ${escapeHtml(message)}
    </div>
  `;

  results.appendChild(card);
}

processBtn.addEventListener(
  "click",
  processFiles
);

startOverBtn.addEventListener(
  "click",
  resetAll
);

function resetAll() {

  files = [];

  fileInput.value = "";

  fileList.innerHTML = "";

  toolCard.classList.add("hidden");

  resultsSection.classList.add("hidden");

  results.innerHTML = "";

  progressWrap.classList.add("hidden");

  startOverBtn.classList.add("hidden");

  processBtn.disabled = false;

  progress.style.width = "0%";

  progressText.textContent =
    "Processing...";

  originalWidth = 0;
  originalHeight = 0;

  widthInput.value = "";
  heightInput.value = "";

  setMode("process");

  cropMode.value = "none";
  cropRatio.value = "free";

  updateCropUI();
}

setMode("process");
updateCropUI();
</script>
